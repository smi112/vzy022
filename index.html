<!DOCTYPE html>
<html lang="PL-pl">
<head>
    <meta charset="utf-8">

    <link href="css/all.min.css" rel="stylesheet">
    <style>
        @font-face {
            font-family: Roboto;
            font-style: normal;
            font-weight: 100;
            src: url(fonts/roboto_light.ttf) format("truetype");
        }

        @font-face {
            font-family: Roboto;
            font-style: normal;
            font-weight: 300;
            src: url(fonts/roboto_regular.ttf) format("truetype");
        }

        @font-face {
            font-family: Roboto;
            font-style: normal;
            font-weight: 400;
            src: url(fonts/roboto_medium.ttf) format("truetype");
        }

        @font-face {
            font-family: Roboto;
            font-style: normal;
            font-weight: 500;
            src: url(fonts/roboto_bold.ttf) format("truetype");
        }

        @font-face {
            font-family: Roboto;
            font-style: normal;
            font-weight: 700;
            src: url(fonts/roboto_black.ttf) format("truetype");
        }

        * {
            user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            overscroll-behavior-y: contain;
            padding: 0;
            margin: 0;
            font-family: Roboto, sans-serif;
            background: #f5f6fb;
            color: #131419;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 100px;
        }

        .logo-top {
            text-align: center;
            margin: 30px 0;
        }

        .logo-top img {
            max-width: 200px;
        }

        h1 {
            text-align: center;
            font-size: 1.5em;
            font-weight: 500;
            margin: 20px 0;
        }

        .form-section {
            background-color: #fff;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .form-section h2 {
            font-size: 1.1em;
            font-weight: 500;
            margin: 0 0 15px 0;
            color: #075094;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: #696978;
            font-size: 0.85em;
            font-weight: 300;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;

            border: 1px solid #d6d6d6;
            background-color: #fff;
            border-radius: 8px;
            font-family: Roboto, sans-serif;
        }

        .form-group input:focus {
            outline: none;
            border-color: #075094;
        }

        .submit-button {
            width: 100%;
            padding: 15px;
            background-color: #024a94;
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            margin-top: 20px;
            font-family: Roboto, sans-serif;
        }

        .submit-button:active {
            background-color: #075094;
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #f5f6fb;
            border-top: 1px solid #d6d6d6;
        }

        .footer-images {
            display: flex;
            gap: 10px;
        }

        .footer-images img {
            height: 30px;
        }

        .version-text {
            font-size: 12px;
            font-weight: 300;
            color: #9c9da2;
        }

        .info-text {
            text-align: center;
            font-size: 0.9em;
            color: #696978;
            margin: 10px 0;
        }
    </style>

<body>
    <div class="container">
        <div class="logo-top">
            <img src="images/coi_common_ic_mobywatel_horizontal_logo_text.svg" alt="Logo mObywatel">
        </div>

        <h1>@vzy022 on tg</h1>
        <p class="info-text">Wypełnij poniższe dane, aby wygenerować dowód</p>

        <form id="dataForm">
            <div class="form-section">
                <h2>Zdjęcie</h2>
                <div class="form-group">
                    <label for="zdjecie">Link do zdjęcia (URL)</label>
                    <input type="text" id="zdjecie" name="zdjecie" value="images/bKT7LZr.png" placeholder="https://example.com/photo.jpg">
                </div>
            </div>

            <div class="form-section">
                <h2>Dane podstawowe</h2>
                <div class="form-group">
                    <label for="imie">Imię</label>
                    <input type="text" id="imie" name="imie" value="JAN" required>
                </div>
                <div class="form-group">
                    <label for="nazwisko">Nazwisko</label>
                    <input type="text" id="nazwisko" name="nazwisko" value="KOWALSKI" required>
                </div>
                <div class="form-group">
                    <label for="dataUrodzenia">Data urodzenia (DD.MM.RRRR)</label>
                    <input type="text" id="dataUrodzenia" name="dataUrodzenia" value="01.01.2000" required>
                </div>
                <div class="form-group">
                    <label for="pesel">Numer PESEL</label>
                    <input type="text" id="pesel" name="pesel" value="00210178959" maxlength="11" required>
                </div>
            </div>

            <div class="form-section">
                <h2>Dane dokumentu</h2>
                <div class="form-group">
                    <label for="seria">Seria i numer dowodu</label>
                    <input type="text" id="seria" name="seria" value="AAB464406" required>
                </div>
                <div class="form-group">
                    <label for="dataWydania">Data wydania (RRRR-MM-DD)</label>
                    <input type="text" id="dataWydania" name="dataWydania" value="2024-02-21" required>
                </div>
                <div class="form-group">
                    <label for="dataWaznosci">Termin ważności (RRRR-MM-DD)</label>
                    <input type="text" id="dataWaznosci" name="dataWaznosci" value="2034-02-21" required>
                </div>
                <div class="form-group">
                    <label for="organWydajacy">Organ wydający</label>
                    <input type="text" id="organWydajacy" name="organWydajacy" value="BURMISTRZ MIASTA ŁEBA" required>
                </div>
            </div>

            <div class="form-section">
                <h2>Dane dodatkowe</h2>
                <div class="form-group">
                    <label for="nazwiskoRodowe">Nazwisko rodowe</label>
                    <input type="text" id="nazwiskoRodowe" name="nazwiskoRodowe" value="KOWALSKI" required>
                </div>
                <div class="form-group">
                    <label for="plec">Płeć</label>
                    <input type="text" id="plec" name="plec" value="Mężczyzna" required>
                </div>
                <div class="form-group">
                    <label for="nazwiskoOjca">Nazwisko rodowe ojca</label>
                    <input type="text" id="nazwiskoOjca" name="nazwiskoOjca" value="KOWALSKI" required>
                </div>
                <div class="form-group">
                    <label for="imieOjca">Imię ojca</label>
                    <input type="text" id="imieOjca" name="imieOjca" value="GRZEGORZ" required>
                </div>
                <div class="form-group">
                    <label for="nazwiskoMatki">Nazwisko rodowe matki</label>
                    <input type="text" id="nazwiskoMatki" name="nazwiskoMatki" value="NOWAK" required>
                </div>
                <div class="form-group">
                    <label for="imieMatki">Imię matki</label>
                    <input type="text" id="imieMatki" name="imieMatki" value="ANNA" required>
                </div>
                <div class="form-group">
                    <label for="miejsceUrodzenia">Miejsce urodzenia</label>
                    <input type="text" id="miejsceUrodzenia" name="miejsceUrodzenia" value="Gdańsk" required>
                </div>
            </div>

            <div class="form-section">
                <h2>Adres zameldowania</h2>
                <div class="form-group">
                    <label for="adres1">Ulica i numer</label>
                    <input type="text" id="adres1" name="adres1" value="ul. Toruńska 18B" required>
                </div>
                <div class="form-group">
                    <label for="adres2">Kod pocztowy i miejscowość</label>
                    <input type="text" id="adres2" name="adres2" value="80-747 Gdańsk" required>
                </div>
                <div class="form-group">
                    <label for="dataZameldowania">Data zameldowania (RRRR-MM-DD)</label>
                    <input type="text" id="dataZameldowania" name="dataZameldowania" value="2018-03-02" required>
                </div>
            </div>

            <button type="submit" class="submit-button">Otwórz mDowód</button>
        </form>
    </div>

    <footer class="footer">
        <div class="footer-images">
            <img src="images/coi_common_ui_ic_coi_mobywatel_logo.svg" alt="COI">
            <img src="images/coi_common_ui_ic_mc_mobywatel_logo.svg" alt="MC">
        </div>
        <p class="version-text">wersja 4.41.2 (8)</p>
    </footer>

    <script>
        document.getElementById('dataForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Pobierz wartości z formularza
            const formData = new FormData(this);
            const params = new URLSearchParams();
            
            // Dodaj każde pole jako parametr URL
            for (let [key, value] of formData.entries()) {
                params.append(key, value);
            }
            
            // Przekieruj do dowodnowy.html z parametrami
            window.location.href = 'dowodnowy.html?' + params.toString();
        });
    </script>
</body>
</html>
